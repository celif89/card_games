<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f4858" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏙️</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <title>Miasteczko S.A.</title>
    <script>
      // Po aktualizacji gry przeglądarka może pamiętać starą stronę, która wskazuje na nieistniejące już pliki.
      // Wtedy przeładowujemy ją raz z pominięciem pamięci podręcznej.
      window.addEventListener(
        'error',
        function (e) {
          var t = e.target;
          if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return;
          try {
            if (sessionStorage.getItem('miasteczko-reloaded')) {
              document.getElementById('boot').textContent = 'Nie udało się wczytać gry. Odśwież stronę za chwilę.';
              return;
            }
            sessionStorage.setItem('miasteczko-reloaded', '1');
          } catch (_) {}
          var u = new URL(location.href);
          u.searchParams.set('v', String(Date.now()));
          location.replace(u.toString());
        },
        true,
      );
    </script>
  </head>
  <body>
    <div id="root"><p id="boot" style="text-align: center; margin-top: 30vh; font-family: system-ui, sans-serif; color: #7d7365">Ładowanie gry…</p></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
